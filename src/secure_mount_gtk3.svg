<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB300;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background circle (Transparent) -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="#1B5E20" stroke-width="1"/>
  
  <!-- Folder/Mount symbol -->
  <g transform="translate(8, 10)">
    <!-- Folder base -->
    <path d="M2 8 L2 20 L26 20 L26 8 Z" fill="#8D6E63" stroke="#6D4C41" stroke-width="1"/>
    <!-- Folder tab -->
    <path d="M2 8 L10 8 L12 6 L18 6 L18 8 Z" fill="#A1887F" stroke="#6D4C41" stroke-width="1"/>
    <!-- Mount indicator (small arrow) -->
    <path d="M14 12 L14 16 L10 14 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="0.5"/>
  </g>
  
  <!-- Lock symbol -->
  <g transform="translate(20, 18)">
    <!-- Lock body -->
    <rect x="0" y="8" width="12" height="8" rx="1" fill="url(#lockGradient)" stroke="#F57C00" stroke-width="1"/>
    <!-- Lock shackle -->
    <path d="M3 8 L3 5 Q3 2 6 2 Q9 2 9 5 L9 8" fill="none" stroke="#F57C00" stroke-width="2" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="6" cy="11" r="1.5" fill="#1B5E20"/>
    <rect x="5.5" y="11" width="1" height="3" fill="#1B5E20"/>
  </g>
  
  <!-- Security shield overlay -->
  <g transform="translate(28, 28)" opacity="0.8">
    <path d="M0 0 L8 0 L8 10 Q8 14 4 16 Q0 14 0 10 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="0.5"/>
    <path d="M4 3 L4 7 L6 9" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Subtle highlight -->
  <ellipse cx="16" cy="12" rx="8" ry="4" fill="white" opacity="0.2"/>
</svg>
